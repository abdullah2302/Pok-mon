<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     
    <link rel="icon" href="favicon-96x96.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    
    <meta name="description" content="A simple Pokémon search application">
    <title>Pokémon</title>
   
</head>

<body>
    <h1> Pokémon Search </h1>
    <p id="source">Source: <a href="https://pokeapi.co/" target="_blank">PokeAPI</a></p>
    <div class="card">
        <input type="text" placeholder="Search for a Pokémon..." id="searchInput" required>
        <button id="searchButton" onClick="fetchPokemon()">Fetch Pokémon</button>
        <button id="randomButton" onClick="fetchRandomPokemon()">Random Pokémon</button>
        <div id="pokemonContainer">
            <img id="pokemonImage" src="" alt="Pokémon Image" style="display: none;">
            <h2 id="pokemonName"></h2>
             <h3 id="pokemonID" style="display: none;">ID: </h3>
             <h3 id="base-stats" style="display: none;">Base Stats:</h3>

            <div id="statsContainer"></div>
            <h3 id="abilitiesTitle" style="display: none;">Abilities:</h3>
            <ul id="abilitiesList"></ul>
        </div>
        
    </div>
    <script src="script.js"></script>
</body>

</html>
